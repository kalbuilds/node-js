<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>node and express js</title>
  </head>
  <body>
    <form action="http://localhost:4000/add-products" method="post">
      <h2>Add products to database</h2>

      <label for="name">Name</label>
      <br />
      <input type="text" name="name" />
      <br />
      <label for="email">Email</label>
      <br />
      <input type="text" name="email" />
      <br />
      <label for="password">Password</label>
      <br />
      <input type="text" name="password" />
      <br />
      <br />

      <h2>Add product Price</h2>
      <label label for="StartPrice">starting_price </label>
      <br />
      <input type="text" name="StartPrice" />
      <br />
      <label for="priceRange">price_range</label>
      <br />
      <input type="text" name="priceRange" />
      <br />

      <h2>Add product description</h2>

      <label for="briefDescription">product_brief_description </label>
      <br />
      <textarea name="briefDescription" id="" cols="30" rows="10"></textarea>
      <br />
      <label for="fullDescription">product_description</label>
      <br />
      <textarea name="fullDescription" id="" cols="30" rows="10"></textarea>
      <br />

      <input type="submit" value="Add products" />
    </form>
  </body>
</html>
